name: Deploy Luminails test site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-pages
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Reject production domain in test repository
        shell: bash
        run: |
          if [[ -e CNAME ]]; then
            echo "::error::A teszt tároló nem tartalmazhat CNAME fájlt."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Verify committed test candidate
        run: npm run check && npm test

      - name: Prepare verified test artifact
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/verified-test-site"
          mkdir -p "$artifact_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            ./ "$artifact_dir/"

      - name: Store verified test artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-test-site
          path: ${{ runner.temp }}/verified-test-site
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified test artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-test-site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload verified static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          include-hidden-files: true

      - name: Deploy test site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed preview
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base_url="${SITE_URL%/}"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${base_url}/"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "${base_url}/foglalas/"
