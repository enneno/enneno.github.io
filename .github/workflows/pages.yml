name: Deploy Luminails test site

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - '.agents/**'
  workflow_dispatch:

concurrency:
  group: test-pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Reject production domain in test repository
        shell: bash
        run: |
          if [[ -e CNAME ]]; then
            echo "::error::A teszt tároló nem tartalmazhat CNAME fájlt."
            exit 1
          fi

      - name: Prepare TEST site
        shell: bash
        run: |
          site_dir="${RUNNER_TEMP}/test-site"
          mkdir -p "$site_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            ./ "$site_dir/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/test-site
          include-hidden-files: true

      - name: Deploy test site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
