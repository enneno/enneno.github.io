name: Deploy Luminails CHATGPT_TEST preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Luminails CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          repository: enneno/Test
          ref: CHATGPT_TEST
          path: preview

      - name: Remove source Pages custom-domain marker
        run: rm -f preview/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload CHATGPT_TEST static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
          include-hidden-files: true

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
