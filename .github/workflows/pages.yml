name: Sync Luminails CHATGPT_TEST preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Luminails CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          repository: enneno/Test
          ref: CHATGPT_TEST
          path: source
          persist-credentials: false

      - name: Replace Hairport files with CHATGPT_TEST
        shell: bash
        run: |
          tar -C source \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./CNAME' \
            -cf /tmp/chatgpt-test-preview.tar .
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'source' \
            -exec rm -rf {} +
          tar -xf /tmp/chatgpt-test-preview.tar -C .
          rm -rf source
          rm -f CNAME

      - name: Commit synchronized preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already synchronized"
            exit 0
          fi
          git commit -m "Sync CHATGPT_TEST preview content"
          git push origin main
